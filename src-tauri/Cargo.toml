[package]
name = "mob"
version = "0.4.0"
description = "MOB desktop client — task dispatch, agent timeline and live desktop"
authors = ["Frozen <1884084+xrdavies@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "mob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }

tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Prefer Secret Service persistence; if it is missing, Rust falls back to an encrypted file (see secrets.rs).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
webkit2gtk = { version = "2", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
